<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 200" width="980" height="200" role="img" aria-label="The camera and the photo gallery">
  <rect width="980" height="200" fill="#12141a"/>
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#8ecbff"/></marker></defs>
  <rect x="20" y="40" width="290" height="60" rx="12" fill="#1b1f27" stroke="#2a2f3a"/>
  <text x="38" y="76" fill="#e8e8e8" font-family="system-ui,sans-serif" font-size="15">The phone enters take-photo mode</text>
  <rect x="330" y="40" width="290" height="60" rx="12" fill="#1b1f27" stroke="#2a2f3a"/>
  <text x="348" y="76" fill="#e8e8e8" font-family="system-ui,sans-serif" font-size="15">The shot is framed on a grid</text>
  <rect x="640" y="40" width="320" height="60" rx="12" fill="#1b1f27" stroke="#2a2f3a"/>
  <text x="658" y="76" fill="#e8e8e8" font-family="system-ui,sans-serif" font-size="15">The camera screen opens and closes</text>
  <rect x="20" y="120" width="460" height="56" rx="12" fill="#1b1f27" stroke="#2a2f3a"/>
  <text x="38" y="154" fill="#e8e8e8" font-family="system-ui,sans-serif" font-size="15">Taking it has its own sound</text>
  <rect x="500" y="120" width="460" height="56" rx="12" fill="#1b1f27" stroke="#2a2f3a"/>
  <text x="518" y="154" fill="#e8e8e8" font-family="system-ui,sans-serif" font-size="15">The picture goes to a gallery you can open</text>
</svg>
